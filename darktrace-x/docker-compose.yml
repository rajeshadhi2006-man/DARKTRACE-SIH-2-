version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: darktrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: darktrace_db
      POSTGRES_USER: darktrace_user
      POSTGRES_PASSWORD: darktrace_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - darktrace_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darktrace_user -d darktrace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18-community
    container_name: darktrace_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/darktrace_neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    networks:
      - darktrace_net
    healthcheck:
      test: ["CMD", "neo4j-admin", "server", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: darktrace_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - darktrace_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darktrace_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://darktrace_user:darktrace_password@postgres:5432/darktrace_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: darktrace_neo4j_password
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: darktrace_x_super_secret_jwt_hmac_sha256_key_production
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - darktrace_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darktrace_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://darktrace_user:darktrace_password@postgres:5432/darktrace_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: darktrace_neo4j_password
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - backend
      - redis
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - darktrace_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darktrace_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - darktrace_net

  nginx:
    image: nginx:1.25-alpine
    container_name: darktrace_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - darktrace_net

networks:
  darktrace_net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
